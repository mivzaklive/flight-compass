name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk FlightCompass.apk
      - name: Verify APK
        run: |
          BT=$(dirname $(ls $ANDROID_HOME/build-tools/*/apksigner | sort -V | tail -1))
          echo "build-tools: $BT"
          $BT/apksigner verify --verbose --print-certs FlightCompass.apk
          $BT/aapt2 dump badging FlightCompass.apk | head -12
          sha256sum FlightCompass.apk
      - uses: actions/upload-artifact@v4
        with:
          name: flight-compass-apk
          path: FlightCompass.apk
      - name: Publish to release "latest"
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest FlightCompass.apk --title "מצפן הטיסות (גרסה אחרונה)" \
            --notes "נבנה מ-${GITHUB_SHA::7}. להתקנה ישירה על הטלפון."
