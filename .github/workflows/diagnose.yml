name: Diagnose
on:
  workflow_dispatch:
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Python skill (reference)
        continue-on-error: true
        run: |
          git clone --depth 1 https://github.com/Brain-ai-biz/cheap-flights /tmp/cf
          cd /tmp && python3 -I -c "
          import sys;sys.path.insert(0,'/tmp/cf/scripts')
          import gflights as g, json, urllib.parse
          from datetime import date,timedelta
          s=date.today()+timedelta(days=1)
          inner=[None,g._filters('TLV','ATH',s.isoformat(),(s+timedelta(days=4)).isoformat(),1,0),[s.isoformat(),(s+timedelta(days=60)).isoformat()],None,[4,4]]
          print('PYBODY', json.dumps([None, json.dumps(inner, separators=(',', ':'))], separators=(',', ':')))
          try:
            r=g.calendar_chunk('TLV','ATH',s,s+timedelta(days=60),4)
            print('PYRESULT', len(r), r[:3])
          except Exception as e:
            print('PYRESULT exception', repr(e))
          "
      - name: Kotlin app code (live)
        env:
          LIVE: "1"
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest --tests '*LiveTest*' -i 2>&1 | grep -E "TRACE|RESULT|FAILED|BUILD" || true

  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run WebView live test on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: chmod +x gradlew && (./gradlew --no-daemon connectedDebugAndroidTest; echo "GRADLE_EXIT=$?"; adb logcat -d -s FCTEST:I | tail -60)
